name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,production]" pip-audit "setuptools>=83.0.0"

      - name: Lint
        run: ruff check .

      - name: Compile source and tests
        run: python -m compileall -q app tests eval scripts

      - name: Credential hygiene
        run: python scripts/secret_scan.py

      - name: Test with branch coverage gate
        run: pytest -q --cov=app --cov-branch --cov-fail-under=80

      - name: PostgreSQL integration gate
        run: python scripts/postgres_integration_probe.py --database-url postgresql://gateway:gateway@localhost:5432/gateway

      - name: Streaming consistency
        run: python scripts/check_streaming_consistency.py

      - name: Functional evaluation
        run: python eval/run_eval.py

      - name: Security evaluation
        run: python eval/run_eval.py --cases eval/security_cases.yaml

      - name: Dependency audit
        # The gateway is installed editable for CI and is not a PyPI package.
        # Audit every resolved third-party dependency while excluding only the
        # local editable project; discovered vulnerabilities still fail CI.
        run: pip-audit --skip-editable

      - name: Repository hygiene gate
        run: |
          test -z "$(git ls-files | grep -E '(^|/)(__pycache__/|.*\.pyc$|.*\.egg-info/|data/.*\.db$|\.reasonix/)')"
          git diff --check
