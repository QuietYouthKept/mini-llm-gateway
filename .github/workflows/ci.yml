name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      matrix:
        python-version: ["3.11"]
    env:
      GATEWAY_CI_EVIDENCE_DIR: evidence-out
      GATEWAY_POSTGRES_URL: postgresql://gateway@localhost:5432/gateway
      GATEWAY_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prepare public evidence directory
        run: mkdir -p evidence-out/status evidence-out/coverage evidence-out/postgres evidence-out/redis evidence-out/http-sse evidence-out/provider

      - name: Install locked dependencies
        run: |
          pip install "uv==0.11.23"
          uv sync --frozen --extra dev --extra production
          uv pip install --python .venv/bin/python "pip-audit==2.9.0"

      - name: Record sanitized environment and dependency versions
        if: always()
        run: |
          {
            python --version
            python -m pip --version
            uv --version
            python -m pytest --version
            python -m pip show pytest-cov coverage
            .venv/bin/coverage --version
            python -m pip freeze
            git rev-parse HEAD
            psql --version || true
            redis-cli --version || true
          } > evidence-out/environment.txt

      - name: Ruff
        if: always()
        run: |
          set +e
          .venv/bin/ruff check . > evidence-out/ruff.log 2>&1
          code=$?
          echo "$code" > evidence-out/status/ruff.exitcode
          cat evidence-out/ruff.log
          exit "$code"

      - name: Compileall
        if: always()
        run: |
          set +e
          .venv/bin/python -m compileall -q app tests eval scripts > evidence-out/compileall.log 2>&1
          code=$?
          echo "$code" > evidence-out/status/compileall.exitcode
          cat evidence-out/compileall.log
          exit "$code"

      - name: Secret scan
        if: always()
        run: |
          set +e
          .venv/bin/python scripts/secret_scan.py > evidence-out/secret-scan.txt 2>&1
          code=$?
          echo "$code" > evidence-out/status/secret-scan.exitcode
          cat evidence-out/secret-scan.txt
          exit "$code"

      - name: Full pytest and application branch coverage
        if: always()
        run: |
          set +e
          export COVERAGE_FILE=evidence-out/coverage/.coverage-pytest
          .venv/bin/pytest -q --junitxml=evidence-out/pytest-junit.xml --cov=app --cov-branch --cov-precision=2 --cov-report=xml:evidence-out/coverage/coverage.xml --cov-report=html:evidence-out/coverage/html > evidence-out/pytest.log 2>&1
          pytest_code=$?
          echo "$pytest_code" > evidence-out/status/pytest.exitcode
          .venv/bin/coverage report --data-file="$COVERAGE_FILE" --fail-under=80 --precision=2 > evidence-out/coverage-gate.log 2>&1
          coverage_code=$?
          echo "$coverage_code" > evidence-out/status/coverage-gate.exitcode
          cat evidence-out/pytest.log
          cat evidence-out/coverage-gate.log
          if [ "$pytest_code" -ne 0 ] || [ "$coverage_code" -ne 0 ]; then
            exit 1
          fi
          exit 0

      - name: PostgreSQL integration and repository coverage
        if: always()
        env:
          DATABASE_URL: ${{ env.GATEWAY_POSTGRES_URL }}
        run: |
          set +e
          .venv/bin/coverage run --branch --data-file=evidence-out/postgres/.coverage --source=app.infrastructure.persistence.postgresql -m scripts.postgres_integration_probe --database-url "$DATABASE_URL" > evidence-out/postgres/integration.json 2> evidence-out/postgres/integration.stderr
          code=$?
          echo "$code" > evidence-out/status/postgres-integration.exitcode
          .venv/bin/coverage report --data-file=evidence-out/postgres/.coverage -m > evidence-out/postgres/coverage.txt 2>&1
          .venv/bin/coverage json --data-file=evidence-out/postgres/.coverage -o evidence-out/postgres/coverage.json
          .venv/bin/coverage xml --data-file=evidence-out/postgres/.coverage -o evidence-out/postgres/coverage.xml
          .venv/bin/coverage html --data-file=evidence-out/postgres/.coverage -d evidence-out/postgres/coverage-html
          cat evidence-out/postgres/integration.json
          cat evidence-out/postgres/coverage.txt
          cat evidence-out/postgres/integration.stderr
          exit "$code"

      - name: Redis adapter integration and adapter coverage
        if: always()
        env:
          REDIS_URL: ${{ env.GATEWAY_REDIS_URL }}
        run: |
          set +e
          .venv/bin/coverage run --branch --data-file=evidence-out/redis/.coverage --source=app.infrastructure.redis -m scripts.redis_adapter_integration_probe --redis-url "$REDIS_URL" > evidence-out/redis/adapters.json 2> evidence-out/redis/adapters.stderr
          code=$?
          echo "$code" > evidence-out/status/redis-adapters.exitcode
          .venv/bin/coverage report --data-file=evidence-out/redis/.coverage -m > evidence-out/redis/coverage.txt 2>&1
          .venv/bin/coverage json --data-file=evidence-out/redis/.coverage -o evidence-out/redis/coverage.json
          .venv/bin/coverage xml --data-file=evidence-out/redis/.coverage -o evidence-out/redis/coverage.xml
          .venv/bin/coverage html --data-file=evidence-out/redis/.coverage -d evidence-out/redis/coverage-html
          cat evidence-out/redis/adapters.json
          cat evidence-out/redis/coverage.txt
          cat evidence-out/redis/adapters.stderr
          exit "$code"

      - name: Redis two-replica HTTP integration
        if: always()
        env:
          DATABASE_URL: ${{ env.GATEWAY_POSTGRES_URL }}
          REDIS_URL: ${{ env.GATEWAY_REDIS_URL }}
        run: |
          set +e
          .venv/bin/python scripts/redis_two_replica_integration_probe.py --database-url "$DATABASE_URL" --redis-url "$REDIS_URL" > evidence-out/redis/two-replica.json 2> evidence-out/redis/two-replica.stderr
          code=$?
          echo "$code" > evidence-out/status/redis-two-replica.exitcode
          cat evidence-out/redis/two-replica.json
          cat evidence-out/redis/two-replica.stderr
          exit "$code"

      - name: HTTP and SSE E2E result
        if: always()
        run: |
          set +e
          .venv/bin/pytest -q --junitxml=evidence-out/http-sse/junit.xml tests/integration/test_uvicorn_streaming_e2e.py > evidence-out/http-sse/result.log 2>&1
          code=$?
          echo "$code" > evidence-out/status/http-sse.exitcode
          cat evidence-out/http-sse/result.log
          exit "$code"

      - name: Provider contract result
        if: always()
        run: |
          set +e
          .venv/bin/pytest -q --junitxml=evidence-out/provider/junit.xml tests/unit/test_openai_compatible_provider.py tests/unit/test_openai_compatible_provider_contract.py > evidence-out/provider/result.log 2>&1
          code=$?
          echo "$code" > evidence-out/status/provider-contract.exitcode
          cat evidence-out/provider/result.log
          exit "$code"

      - name: Functional evaluation
        if: always()
        run: |
          set +e
          .venv/bin/python eval/run_eval.py > evidence-out/functional-eval.txt 2>&1
          code=$?
          echo "$code" > evidence-out/status/functional-eval.exitcode
          cat evidence-out/functional-eval.txt
          exit "$code"

      - name: Security evaluation
        if: always()
        run: |
          set +e
          .venv/bin/python eval/run_eval.py --cases eval/security_cases.yaml > evidence-out/security-eval.txt 2>&1
          code=$?
          echo "$code" > evidence-out/status/security-eval.exitcode
          cat evidence-out/security-eval.txt
          exit "$code"

      - name: Dependency audit
        if: always()
        run: |
          set +e
          .venv/bin/pip-audit --skip-editable --format=json > evidence-out/dependency-audit.json 2> evidence-out/dependency-audit.stderr
          code=$?
          echo "$code" > evidence-out/status/dependency-audit.exitcode
          cat evidence-out/dependency-audit.json
          cat evidence-out/dependency-audit.stderr
          exit "$code"

      - name: Repository hygiene and diff check
        if: always()
        run: |
          set +e
          test -z "$(git ls-files | grep -E '(^|/)(__pycache__/|.*\.pyc$|.*\.egg-info/|data/.*\.db$|\.reasonix/)' )" && git diff --check > evidence-out/diff-check.log 2>&1
          code=$?
          echo "$code" > evidence-out/status/repository-hygiene.exitcode
          cat evidence-out/diff-check.log
          exit "$code"

      - name: Build Evidence Manifest
        id: evidence-manifest
        if: always()
        run: |
          python scripts/build_evidence_manifest.py --directory evidence-out

      - name: Upload reviewable CI evidence
        id: evidence-upload
        if: always() && steps.evidence-manifest.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gateway-ci-evidence-${{ github.sha }}-run-${{ github.run_id }}
          path: evidence-out/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

      - name: Download and validate the uploaded evidence ZIP
        id: evidence-zip-validation
        if: always() && steps.evidence-upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.evidence-upload.outputs.artifact-id }}
        run: |
          set +e
          archive="$RUNNER_TEMP/wave3-evidence-${ARTIFACT_ID}.zip"
          download_url=$(curl --fail --silent --show-error --output /dev/null --write-out '%{redirect_url}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip")
          api_code=$?
          download_code=0
          if [ "$api_code" -ne 0 ] || [ -z "$download_url" ]; then
            download_code=1
          else
            curl --fail --silent --show-error --location --max-redirs 3 \
              --retry 5 --retry-delay 1 --retry-all-errors \
              "$download_url" --output "$archive"
            download_code=$?
          fi
          .venv/bin/python scripts/validate_evidence_artifact.py \
            --archive "$archive" \
            --output evidence-out/artifact-validation.json
          validation_code=$?
          if [ "$download_code" -ne 0 ]; then
            exit "$download_code"
          fi
          exit "$validation_code"

      - name: Upload machine-readable evidence validation result
        if: always() && steps.evidence-zip-validation.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: gateway-evidence-validation-${{ github.sha }}-run-${{ github.run_id }}
          path: evidence-out/artifact-validation.json
          if-no-files-found: error
          retention-days: 30
