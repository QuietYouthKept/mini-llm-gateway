# Test-only: bind is safe here only because this disposable network has no published ports.
# Never use this configuration for production.
port 26379
bind 0.0.0.0
protected-mode no
daemonize no
logfile ""
dir /tmp
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel monitor wave5master redis-primary 6379 2
sentinel down-after-milliseconds wave5master 5000
sentinel failover-timeout wave5master 15000
sentinel parallel-syncs wave5master 1
