gateway:
  name: mini-llm-gateway
  environment: local
  default_profile: fast-chat
  # A real internet Provider needs more headroom than deterministic local mocks.
  request_timeout_ms: 5000

clients:
  - client_id: demo-client
    api_key: demo-key
    enabled: true
    rate_limit:
      requests_per_minute: 60
    token_budget:
      period: daily
      max_tokens: 100000
      max_cost_usd: 0

  - client_id: tiny-budget-client
    api_key: tiny-key
    enabled: true
    rate_limit:
      requests_per_minute: 5
    token_budget:
      period: daily
      max_tokens: 50
      max_cost_usd: 0

  - client_id: burst-client
    api_key: burst-key
    enabled: true
    rate_limit:
      requests_per_minute: 3
    token_budget:
      period: daily
      max_tokens: 100000
      max_cost_usd: 0

providers:
  mock_fast:
    type: mock
    enabled: true
    behavior:
      latency_ms: 30
      # Enables repeatable client-disconnect experiments without a real model.
      stream_chunk_delay_ms: 50
      error_rate: 0.0
      timeout_ms: 1000
      default_response: "fast response from mock_fast"

  mock_stable:
    type: mock
    enabled: true
    behavior:
      latency_ms: 80
      error_rate: 0.0
      timeout_ms: 1000
      default_response: "stable mock response"

  mock_slow:
    type: mock
    enabled: true
    behavior:
      latency_ms: 150
      error_rate: 0.0
      timeout_ms: 500
      default_response: "slow mock response"

  mock_error:
    type: mock
    enabled: true
    behavior:
      latency_ms: 10
      error_rate: 1.0
      timeout_ms: 1000
      default_response: "this should usually fail"

  fake_static:
    type: fake_static
    enabled: true
    behavior:
      latency_ms: 5
      error_rate: 0.0
      timeout_ms: 1000
      default_response: "safe fallback response from fake_static"

  # Real DeepSeek provider. The secret comes only from DEEPSEEK_API_KEY; it is
  # intentionally not present in this repository or persisted by the gateway.
  deepseek:
    type: openai_compatible
    enabled: true
    http:
      # The adapter appends /chat/completions itself; do not append /v1 here.
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-flash
      timeout_ms: 30000

  # Local real-model providers (OpenAI-compatible; no cloud API key needed).
  # Start 'ollama serve' or a vLLM server, then enable one of these.
  # ollama-local:
  #   type: openai_compatible
  #   enabled: false
  #   http:
  #     base_url: http://localhost:11434/v1
  #     model: llama3.2
  #     timeout_ms: 30000
  # vllm-local:
  #   type: openai_compatible
  #   enabled: false
  #   http:
  #     base_url: http://localhost:8000/v1
  #     model: Qwen/Qwen2.5-7B-Instruct
  #     timeout_ms: 30000

model_profiles:
  fast-chat:
    description: "Low-latency chat profile for quick responses."
    intent: low_latency
    capabilities:
      context_window: 8192
      supports_tools: false
      supports_streaming: true
    preferences:
      latency_priority: high
      cost_priority: medium
      stability_priority: medium
    routing:
      strategy: priority
      candidates:
        - provider: mock_fast
          priority: 1
        - provider: mock_stable
          priority: 2
        - provider: fake_static
          priority: 3
    fallback:
      enabled: true
      trigger_on:
        - provider_error
        - timeout
        - bad_status
      chain:
        - mock_fast
        - mock_stable
        - fake_static

  fallback-chat:
    description: "Demonstrates fallback: primary always fails, then stable succeeds."
    intent: demo_fallback
    capabilities:
      context_window: 8192
    routing:
      strategy: priority
      candidates:
        - provider: mock_error
          priority: 1
        - provider: mock_stable
          priority: 2
    fallback:
      enabled: true
      trigger_on: [provider_error, timeout, bad_status]
      chain: [mock_error, mock_stable]

  timeout-chat:
    description: "Demonstrates timeout-triggered fallback."
    intent: demo_timeout
    capabilities:
      context_window: 8192
    routing:
      strategy: priority
      candidates:
        - provider: mock_slow
          priority: 1
        - provider: mock_fast
          priority: 2
    fallback:
      enabled: true
      trigger_on: [provider_error, timeout, bad_status]
      chain: [mock_slow, mock_fast]

  deepseek-chat:
    description: "Small-traffic real-provider validation through DeepSeek."
    intent: real_provider_validation
    capabilities:
      context_window: 8192
      supports_tools: false
      supports_streaming: true
    preferences:
      stability_priority: high
    routing:
      strategy: priority
      candidates:
        - provider: deepseek
          priority: 1
    # Keep the validation path single-provider so cost, provider request IDs,
    # and error semantics are attributable to DeepSeek rather than a mock fallback.
    fallback:
      enabled: false
      chain: [deepseek]

token_estimation:
  strategy: heuristic
  chars_per_token: 4
  min_tokens: 1
  # Real providers include protocol/system-token overhead that a character
  # heuristic cannot observe. Reserve conservatively, then settle actual usage.
  reservation_input_floor: 128
  # DeepSeek Flash peak cache-miss rates as verified 2026-10-06. Peak values
  # are intentional: budgets must remain conservative across billing windows.
  cost_per_1k_input_tokens_usd: 0.0003
  cost_per_1k_output_tokens_usd: 0.0012

retry:
  max_retries: 1
  base_delay_ms: 20
  max_delay_ms: 200
  retry_on: [provider_timeout, provider_failed, provider_bad_status]

circuit_breaker:
  enabled: true
  failure_threshold: 3
  recovery_timeout_ms: 2000
  half_open_max_calls: 1

guardrails:
  enabled: true
  audit: true
  input_policy:
    max_chars: 4000
    blocked_regex:
      - 'drop\s+table'
      - 'ignore\s+(all\s+)?previous\s+instructions'
      - 'reveal\s+(your\s+)?system\s+prompt'
      - 'show\s+me\s+(your\s+)?(system\s+)?(instructions|prompt)'
    pii_detection: true
    prompt_injection: true
  output_policy:
    max_chars: 8000
    blocked_terms: [api_key, access_token, secret, password, "private key"]
    pii_redaction: false

logging:
  persist_request_body: false
  persist_response_body: false
  # Contains original messages; deliberately opt-in for privacy.
  persist_replay_payload: false
  persist_attempts: true
  persist_budget_snapshot: true

streaming:
  # Low-latency incremental output checks run before each emitted chunk. They
  # cannot retract chunks already delivered if a later window is blocked.
  enabled: true
  behavior_if_requested: reject
  output_guardrail_mode: incremental

metrics:
  enabled: true
  prefix: llm_gateway

admin:
  enabled: true
  api_key: admin-key

observability:
  structured_json_logs: true
  tracing_enabled: true
  max_spans: 2048

cache:
  enabled: true
  max_entries: 256
  ttl_ms: 300000

replay:
  # Live replay can incur provider cost and mutate provider-side state.
  allow_live: false
